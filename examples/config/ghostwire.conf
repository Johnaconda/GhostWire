# Nonsecret configuration only. Paths are literal UTF-8, no quotes or expansion.
# Full-line # comments only; no inline comments. All keys are optional.
schema_version=1
log_level=info
privacy_mode=protected
worker_limit=2
queue_limit=1024
# data_root must be absolute when provided. Prefer --data-root for local overrides.
# A01 enforces logical work admission budgets; it creates no transport or workers.
# privacy_mode is validated policy configuration until transport is implemented.
